[project]
name = "pi-agent-core"
version = "0.1.0"
description = "Agent runtime for Pi (Python port of @earendil-works/pi agent): runLoop, tool dispatch, EventStream"
requires-python = ">=3.12"
dependencies = [
    "pi-ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent_core"]
