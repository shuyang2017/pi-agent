[project]
name = "pi-ai"
version = "0.1.0"
description = "Multi-provider LLM streaming abstraction for Pi (Python port of @earendil-works/pi ai)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "partialjson>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai"]
