[project]
name = "pi-tui"
version = "0.1.0"
description = "Textual terminal UI for Pi (Python port of @earendil-works/pi tui)"
requires-python = ">=3.12"
dependencies = [
    "pi-agent-core",
]

[project.optional-dependencies]
tui = ["textual>=0.70"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_tui"]
