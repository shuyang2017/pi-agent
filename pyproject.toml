[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-agent-core = { workspace = true }
pi-coding-agent = { workspace = true }
pi-tui = { workspace = true }
pi-telemetry = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/pi_ai/src", "packages/pi_agent_core/src", "packages/pi_coding_agent/src", "packages/pi_tui/src", "packages/pi_telemetry/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "-q"
# Guard against runaway/awaiting-forever tests hanging the whole suite.
# thread method prints a traceback; raise if a single test exceeds 30s.
timeout = 30
timeout_method = "thread"
